schemaVersion: "1.0"
id: coding
version: 1
description: Bounded scope-freeze governance for coding work (planning and implementation), forcing a human decision instead of an open-ended review loop.
appliesTo:
  - PLAN
  - IMPLEMENT
  - REVIEW
incompatibleWith: []
rules:
  requireScopeFreeze: true
  requireHumanFinalApproval: true
  requireIndependentReview: true
  maxReviewRounds: 2
