schemaVersion: "1.0"
id: default
version: 1
description: Baseline safety floor applied to every task family. Human stays the final approver of results and every mutation requires execution approval before it can run.
appliesTo:
  - DIRECT
  - RESEARCH
  - PLAN
  - IMPLEMENT
  - REVIEW
  - UI
  - QA
  - SECURITY
  - OPERATIONS
incompatibleWith: []
rules:
  requireHumanFinalApproval: true
  requireExecutionApprovalForMutation: true
  maxReviewRounds: 3
